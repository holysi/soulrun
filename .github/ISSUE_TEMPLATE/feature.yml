name: Feature
description: Specify an independently verifiable product or engineering outcome.
title: '[FEATURE] '
labels: ['type:feature', 'status:ready']
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the user or contributor outcome, not only implementation steps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a Markdown checklist of observable results.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List commands, seeds, browser/viewport, and expected evidence.
    validations:
      required: true
