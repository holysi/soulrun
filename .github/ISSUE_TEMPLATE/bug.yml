name: Bug report
description: Report a reproducible defect in 魂夜輪迴.
title: '[BUG] '
labels: ['type:bug', 'status:ready']
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observed behavior
      description: Include what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include exact steps, seed, browser, and viewport where applicable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, traces, or recordings.
